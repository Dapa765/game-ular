<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Ular dengan Rintangan & Pengaturan Kecepatan</title>
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h2 {
            margin: 0 0 5px 0;
            color: #4CAF50;
        }
        #score {
            margin-bottom: 10px;
            font-size: 18px;
        }
        .canvas-container {
            position: relative;
        }
        canvas {
            border: 3px solid #4CAF50;
            background: #000;
            display: block;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }
        .btn:hover {
            background: #45a049;
        }
        .speed-selector {
            margin: 10px 0;
        }
        .speed-selector label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #aaa;
        }
        .speed-btn {
            background: #222;
            color: white;
            border: 2px solid #555;
            padding: 5px 10px;
            margin: 0 2px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .speed-btn.active {
            background: #4CAF50;
            border-color: #4CAF50;
            font-weight: bold;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 50px);
            gap: 5px;
            margin-top: 15px;
        }
        .ctrl-btn {
            background: #222;
            color: white;
            border: 2px solid #4CAF50;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        .ctrl-btn:active {
            background: #4CAF50;
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h2>Game Ular</h2>
    <div id="score">Skor: 0</div>
    
    <div class="canvas-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <!-- Layar Mulai -->
        <div id="startScreen" class="overlay">
            <h3>SNAKE GAME</h3>
            <div class="speed-selector">
                <label>Pilih Kecepatan:</label>
                <button class="speed-btn" onclick="setSpeed(160, this)">Lambat</button>
                <button class="speed-btn active" onclick="setSpeed(110, this)">Normal</button>
                <button class="speed-btn" onclick="setSpeed(70, this)">Cepat</button>
            </div>
            <button class="btn" onclick="startGame()">Mulai Game</button>
        </div>

        <!-- Layar Game Over -->
        <div id="gameOverScreen" class="overlay hidden">
            <h3 style="color: #FF5252; margin: 0 0 5px 0;">GAME OVER!</h3>
            <p id="finalScore" style="margin: 0 0 10px 0;">Skor: 0</p>
            <div class="speed-selector">
                <label>Atur Ulang Kecepatan:</label>
                <button class="speed-btn" onclick="setSpeed(160, this)">Lambat</button>
                <button class="speed-btn active" onclick="setSpeed(110, this)">Normal</button>
                <button class="speed-btn" onclick="setSpeed(70, this)">Cepat</button>
            </div>
            <button class="btn" onclick="startGame()">Main Lagi</button>
        </div>
    </div>

    <!-- Kontroler Tombol -->
    <div class="controls">
        <button class="ctrl-btn" id="btn-up" onclick="setDir(0, -1)">▲</button>
        <button class="ctrl-btn" id="btn-left" onclick="setDir(-1, 0)">◀</button>
        <button class="ctrl-btn" id="btn-down" onclick="setDir(0, 1)">▼</button>
        <button class="ctrl-btn" id="btn-right" onclick="setDir(1, 0)">▶</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const startScreen = document.getElementById("startScreen");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const finalScoreEl = document.getElementById("finalScore");

        const size = 20;
        const count = canvas.width / size;

        let snake = [];
        let food = { x: 5, y: 5 };
        
        // 2 Rintangan Bentuk Abstrak di dalam Arena
        const obstacles = [
            // Rintangan 1 (Bentuk L di kiri atas)
            { x: 4, y: 4 }, { x: 4, y: 5 }, { x: 5, y: 5 }, { x: 6, y: 5 },
            // Rintangan 2 (Bentuk Zig-zag abstrak di kanan bawah)
            { x: 13, y: 14 }, { x: 14, y: 14 }, { x: 14, y: 15 }, { x: 15, y: 15 }, { x: 16, y: 15 }
        ];

        let dx = 1;
        let dy = 0;
        let score = 0;
        let interval = null;
        let changing = false;
        let gameSpeed = 110;

        function setSpeed(speed, buttonElement) {
            gameSpeed = speed;
            // Sinkronisasi tombol aktif di semua elemen UI (layar start dan game over)
            const speedButtons = document.querySelectorAll('.speed-btn');
            speedButtons.forEach(btn => {
                if (btn.textContent === buttonElement.textContent) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function startGame() {
            startScreen.classList.add("hidden");
            gameOverScreen.classList.add("hidden");
            
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            score = 0;
            scoreEl.innerText = "Skor: " + score;
            spawnFood();

            if (interval) clearInterval(interval);
            interval = setInterval(gameLoop, gameSpeed);
        }

        function gameLoop() {
            changing = false;
            
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            
            // Cek tabrakan dinding
            if (head.x < 0 || head.x >= count || head.y < 0 || head.y >= count) {
                gameOver();
                return;
            }
            
            // Cek tabrakan tubuh sendiri
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            // Cek tabrakan rintangan abstrak
            for (let i = 0; i < obstacles.length; i++) {
                if (head.x === obstacles[i].x && head.y === obstacles[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Cek makan apel
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = "Skor: " + score;
                spawnFood();
            } else {
                snake.pop();
            }

            // Render Arena
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render Rintangan Abstrak
            ctx.fillStyle = "#78909C";
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x * size, obs.y * size, size - 2, size - 2);
            });

            // Render Apel Merah
            ctx.fillStyle = "#FF5252";
            ctx.fillRect(food.x * size, food.y * size, size - 2, size - 2);

            // Render Ular
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#8BC34A" : "#4CAF50";
                ctx.fillRect(part.x * size, part.y * size, size - 2, size - 2);
            });
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * count);
            food.y = Math.floor(Math.random() * count);
            
            // Pastikan apel tidak muncul di atas ular atau rintangan
            let collision = snake.some(p => p.x === food.x && p.y === food.y) ||
                            obstacles.some(o => o.x === food.x && o.y === food.y);
            if (collision) {
                spawnFood();
            }
        }

        function gameOver() {
            clearInterval(interval);
            finalScoreEl.innerText = "Skor Akhir: " + score;
            gameOverScreen.classList.remove("hidden");
        }

        function setDir(newDx, newDy) {
            if (changing) return;
            if (newDx === -dx && newDx !== 0) return;
            if (newDy === -dy && newDy !== 0) return;
            dx = newDx;
            dy = newDy;
            changing = true;
        }

        // Kontrol Keyboard (Panah & WASD)
        window.addEventListener("keydown", e => {
            if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") setDir(0, -1);
            if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") setDir(0, 1);
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") setDir(-1, 0);
            if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") setDir(1, 0);
        });
    </script>
</body>
</html>
